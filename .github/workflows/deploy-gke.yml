name: GitHub Actions CI-CD to GKE

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy_existing_tag:
        description: "Optional: Existing GAR image tag to deploy (e.g., v1 or latest)"
        required: false
        default: ""

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  GKE_CLUSTER_ENDPOINT: ${{ vars.GKE_CLUSTER_ENDPOINT }}
  IMAGE_NAME: my-app
  HELM_RELEASE: my-app
  NAMESPACE: ${{ vars.K8S_NAMESPACE }}

jobs:

  build-and-deploy:

    name: Build and Deploy
    runs-on: ubuntu-latest

    # Do not deploy from pull requests.
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      id-token: write

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Run application tests
      - name: Run tests
        run: npm test

      # 4. Resolve image tag (pre-built tag or 12-char commit SHA)
      - name: Resolve image metadata
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.deploy_existing_tag }}" ]; then
            echo "tag=${{ github.event.inputs.deploy_existing_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_SHA::12}" >> $GITHUB_OUTPUT
          fi

      # 5. Authenticate with Google Cloud using Direct WIF
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      # 6. Configure Docker authentication for GAR
      - name: Configure Docker
        if: ${{ github.event.inputs.deploy_existing_tag == '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # 7. Build and push Docker image to Artifact Registry
      - name: Build and push Docker image
        if: ${{ github.event.inputs.deploy_existing_tag == '' }}
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME"

          docker build \
            -t "$IMAGE_URI:${{ steps.meta.outputs.tag }}" \
            -t "$IMAGE_URI:latest" .

          docker push "$IMAGE_URI" --all-tags

      # 8. Configure GKE cluster credentials via endpoint & WIF token
      - name: Get GKE credentials
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: |
          echo "${{ secrets.GKE_CLUSTER_CA_DATA }}" | base64 -d > /tmp/ca.crt

          kubectl config set-cluster gowmitha-ingress \
            --server="https://$GKE_CLUSTER_ENDPOINT" \
            --certificate-authority=/tmp/ca.crt \
            --embed-certs=true

          kubectl config set-credentials github-wif-user \
            --token="${{ steps.auth.outputs.access_token }}"

          kubectl config set-context gke-context \
            --cluster=gowmitha-ingress \
            --user=github-wif-user

          kubectl config use-context gke-context

      # 9. Deploy application to GKE using Helm
      - name: Deploy to GKE
        id: deploy
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME"

          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install "$HELM_RELEASE" ./helm/my-app \
            --namespace "$NAMESPACE" \
            --set image.repository="$IMAGE_URI" \
            --set image.tag="${{ steps.meta.outputs.tag }}" \
            --set env.DEPLOYED_COMMIT="$GITHUB_SHA" \
            --set secrets.dbPassword="${{ secrets.APP_DB_PASSWORD }}" \
            --rollback-on-failure \
            --cleanup-on-fail \
            --wait \
            --timeout 2m

      # 10. Validate deployment, health endpoint, and rollback on failure
      - name: Validate deployment and health check
        id: validation
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: |
          if ! kubectl rollout status deployment/$HELM_RELEASE -n "$NAMESPACE" --timeout=120s; then
            echo "Deployment rollout failed. Triggering Helm rollback..."
            helm rollback "$HELM_RELEASE" 0 -n "$NAMESPACE" --wait || true
            exit 1
          fi

          kubectl port-forward svc/$HELM_RELEASE 8080:80 -n "$NAMESPACE" &
          PF_PID=$!
          sleep 3

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/readyz || true)
          kill $PF_PID || true

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Smoke test failed (HTTP $HTTP_STATUS). Triggering Helm rollback..."
            helm rollback "$HELM_RELEASE" 0 -n "$NAMESPACE" --wait || true
            exit 1
          fi

          echo "Deployment and /readyz health check passed (HTTP 200)."

      # 11. Verify running pods and services
      - name: Verify GKE resources
        if: success()
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: |
          kubectl get deployments -n "$NAMESPACE"
          kubectl get pods -n "$NAMESPACE"
          kubectl get services -n "$NAMESPACE"
          helm list -n "$NAMESPACE"

      # 12. Display deployment information
      - name: Deployment summary
        if: success()
        run: |
          echo "Application deployed successfully!"
          echo "Project: $PROJECT_ID"
          echo "Cluster: gowmitha-ingress ($GKE_CLUSTER_ENDPOINT)"
          echo "Image: $REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE_NAME:${{ steps.meta.outputs.tag }}"
          echo "Namespace: $NAMESPACE"
