name: Build, Push & Deploy to GKE

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_existing_tag:
        description: "Optional: Deploy an existing GAR image tag directly (e.g., v1 or latest)"
        required: false
        default: ""
      rollback_revision:
        description: "Optional: Helm revision number to roll back to (leave empty for normal deploy)"
        required: false
        default: ""

env:
  IMAGE_NAME: my-app
  HELM_RELEASE: my-app

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Tests
        run: npm test

  build-and-push:
    name: Build & Push Image to GAR
    needs: test
    if: ${{ github.event.inputs.rollback_revision == '' && github.event.inputs.deploy_existing_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
      full_image: ${{ steps.meta.outputs.full_image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Image Metadata
        id: meta
        run: |
          SHA_TAG="${GITHUB_SHA::12}"
          REGISTRY="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}"
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "full_image=${REGISTRY}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud via Direct WIF
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Mint STS Access Token for Docker
        id: gcp-token
        run: echo "token=$(gcloud auth print-access-token)" >> $GITHUB_OUTPUT

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-token.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.full_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GKE Cluster
    needs: [test, build-and-push]
    if: ${{ always() && needs.test.result == 'success' && (needs.build-and-push.result == 'success' || github.event.inputs.rollback_revision != '' || github.event.inputs.deploy_existing_tag != '') }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Target Image & Tag
        id: target
        run: |
          REGISTRY="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}"
          echo "full_image=${REGISTRY}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT
          if [ -n "${{ github.event.inputs.deploy_existing_tag }}" ]; then
            echo "image_tag=${{ github.event.inputs.deploy_existing_tag }}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${{ needs.build-and-push.outputs.image_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud via Direct WIF
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Configure Kubeconfig Directly via Endpoint & WIF Token
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          echo "${{ secrets.GKE_CLUSTER_CA_DATA }}" | base64 -d > /tmp/gke-ca.crt
          kubectl config set-cluster gke-cluster \
            --server="https://${{ vars.GKE_CLUSTER_ENDPOINT }}" \
            --certificate-authority=/tmp/gke-ca.crt \
            --embed-certs=true
          kubectl config set-credentials github-wif-user \
            --token="${ACCESS_TOKEN}"
          kubectl config set-context gke-context \
            --cluster=gke-cluster \
            --user=github-wif-user
          kubectl config use-context gke-context

      - name: Ensure Target Namespace & Secret Exist
        run: |
          kubectl create namespace ${{ vars.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic ${{ env.HELM_RELEASE }}-secrets \
            --namespace=${{ vars.K8S_NAMESPACE }} \
            --from-literal=db-password="${{ secrets.APP_DB_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Execute Manual Helm Rollback
        if: ${{ github.event.inputs.rollback_revision != '' }}
        run: |
          helm rollback ${{ env.HELM_RELEASE }} ${{ github.event.inputs.rollback_revision }} \
            --namespace ${{ vars.K8S_NAMESPACE }} \
            --wait \
            --timeout 2m

      - name: Deploy Application via Helm (Rollback-on-Failure)
        if: ${{ github.event.inputs.rollback_revision == '' }}
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} ./helm/my-app \
            --namespace ${{ vars.K8S_NAMESPACE }} \
            --set image.repository="${{ steps.target.outputs.full_image }}" \
            --set image.tag="${{ steps.target.outputs.image_tag }}" \
            --set env.DEPLOYED_COMMIT="${{ github.sha }}" \
            --rollback-on-failure \
            --cleanup-on-fail \
            --wait \
            --timeout 2m

      - name: Validate Rollout & Pod Readiness
        run: |
          kubectl rollout status deployment/${{ env.HELM_RELEASE }} \
            --namespace=${{ vars.K8S_NAMESPACE }} \
            --timeout=120s
          kubectl get pods -l app=${{ env.HELM_RELEASE }} -n ${{ vars.K8S_NAMESPACE }}

      - name: Run Smoke Health Check Against Service Endpoint
        run: |
          kubectl port-forward svc/${{ env.HELM_RELEASE }} 8080:80 -n ${{ vars.K8S_NAMESPACE }} &
          PF_PID=$!
          sleep 3

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/readyz || true)
          kill $PF_PID || true

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Smoke test failed with HTTP status $HTTP_STATUS. Triggering emergency rollback..."
            helm rollback ${{ env.HELM_RELEASE }} 0 --namespace ${{ vars.K8S_NAMESPACE }} --wait
            exit 1
          fi
          echo "Smoke test passed! Endpoint returned HTTP 200."
