replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/internal-sandbox-446612/interns-poc-repo/my-app
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

env:
  NODE_ENV: "production"
  LOG_LEVEL: "info"

secrets:
  dbPassword: ""

resources:
  requests:
    cpu: "10m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

probes:
  livenessPath: /healthz
  readinessPath: /readyz
